name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / SwiftUI + Go
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Verify macOS
        run: mise run verify

  windows:
    name: Windows / WinUI 3 + Go + Velopack
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CI_VERSION: 0.0.1-ci.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify Go backend on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location backend
          try {
            go run ./cmd/contractgen -root .. -check
            go vet ./...
            go test ./...
          }
          finally {
            Pop-Location
          }

      - name: Build self-contained WinUI applications
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version $env:CI_VERSION -BuildNumber $env:GITHUB_RUN_NUMBER

      - name: Smoke test non-interactive Windows signing import
        shell: pwsh
        run: ./scripts/test-windows-signing-certificate-import.ps1

      - name: Package unsigned per-user installers
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:CI_VERSION -Channel beta

      - name: Verify Windows artifacts
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Version $env:CI_VERSION -Channel beta -RequirePackages
