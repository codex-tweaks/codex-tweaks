name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 v* Git 标签，例如 v3.0.0 或 v3.0.0-beta.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-26
    environment: release
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_SIGNING_CERT_SHA256: ${{ vars.MACOS_SIGNING_CERT_SHA256 }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.MACOS_SPARKLE_EDDSA_PUBLIC_KEY }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$(git rev-parse HEAD)"

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Test macOS
        run: mise run test

      - name: Import and verify macOS signing identity
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          CODE_SIGNING_EXPORT_PASSWORD: ${{ secrets.CODE_SIGNING_EXPORT_PASSWORD }}
        run: ./scripts/import-macos-signing-identity.sh

      - name: Build and verify macOS release artifacts
        run: mise run release

      - name: Create signed Sparkle update and appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_EDDSA_PRIVATE_KEY }}
        run: mise run release:sparkle

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ env.RELEASE_TAG }}
          path: |
            dist/Codex-Tweaks-${{ env.RELEASE_TAG }}.dmg
            dist/Codex-Tweaks-${{ env.RELEASE_TAG }}-arm64.dmg
            dist/Codex-Tweaks-${{ env.RELEASE_TAG }}-x86_64.dmg
            dist/Codex-Tweaks-${{ env.RELEASE_TAG }}-sparkle.zip
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows release
    runs-on: windows-2025
    environment: release
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Missing release tag: $env:RELEASE_TAG" }
          $tagCommit = git rev-list -n 1 "refs/tags/$env:RELEASE_TAG"
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw 'Release tag does not point at HEAD.' }

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test Go backend on Windows
        shell: pwsh
        run: |
          Push-Location backend
          try {
            go run ./cmd/contractgen -root .. -check
            go vet ./...
            go test ./...
          }
          finally {
            Pop-Location
          }

      - name: Import and verify Windows signing identity
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_EXPORT_PASSWORD: ${{ secrets.CODE_SIGNING_EXPORT_PASSWORD }}
        run: ./scripts/import-windows-signing-certificate.ps1

      - name: Build, package, and verify Windows release
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $channel = if ($env:RELEASE_TAG.Contains('-')) { 'beta' } else { 'stable' }
          ./scripts/build-windows.ps1 -Version $version -BuildNumber $env:BUILD_NUMBER
          ./scripts/package-windows.ps1 -Version $version -Channel $channel
          ./scripts/verify-windows.ps1 `
            -Version $version `
            -Channel $channel `
            -RequirePackages `
            -ExpectedSigningCertificateSha256 $env:WINDOWS_SIGNING_CERT_SHA256

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ env.RELEASE_TAG }}
          path: artifacts/windows/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs:
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-macos-${{ env.RELEASE_TAG }}
          path: release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-windows-${{ env.RELEASE_TAG }}
          path: release-assets/windows

      - name: Generate bilingual download guide
        env:
          RELEASE_ASSET_ROOT: release-assets
          RELEASE_BODY_PATH: release-assets/release-body.md
        run: ./scripts/generate-release-body.sh

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-assets/release-body.md
          files: |
            release-assets/macos/*
            release-assets/windows/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true

      - name: Publish signed Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          appcast_path='release-assets/macos/appcast.xml'
          test -s "$appcast_path"

          encoded_appcast="$(base64 < "$appcast_path" | tr -d '\n')"
          appcast_blob_sha="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/blobs" \
              -f "content=$encoded_appcast" \
              -f encoding=base64 \
              --jq '.sha'
          )"
          appcast_tree_sha="$(
            # Keep the updates branch feed-only by intentionally omitting base_tree.
            jq -n \
              --arg sha "$appcast_blob_sha" \
              '{tree: [{path: "appcast.xml", mode: "100644", type: "blob", sha: $sha}]}' \
            | gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/git/trees" \
                --input - \
                --jq '.sha'
          )"
          updates_commit_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/updates" \
              --jq '.object.sha' \
              2>/dev/null \
              || true
          )"
          appcast_commit_sha="$(
            jq -n \
              --arg message "chore(release): update Sparkle appcast for $RELEASE_TAG" \
              --arg tree "$appcast_tree_sha" \
              --arg parent "$updates_commit_sha" \
              '{message: $message, tree: $tree} + (if $parent == "" then {} else {parents: [$parent]} end)' \
            | gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/git/commits" \
                --input - \
                --jq '.sha'
          )"

          if [[ -n "$updates_commit_sha" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/updates" \
              -f "sha=$appcast_commit_sha" \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/heads/updates' \
              -f "sha=$appcast_commit_sha" \
              >/dev/null
          fi

  cleanup:
    name: Delete temporary release artifacts
    if: ${{ always() }}
    needs:
      - macos
      - windows
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )"
          if [[ -z "$artifact_ids" ]]; then
            echo "No temporary release artifacts found."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"
