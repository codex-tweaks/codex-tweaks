[tools]
actionlint = "1.7.12"
"pipx:dmgbuild" = "1.6.7"
"github:sparkle-project/Sparkle" = { version = "2.9.6", asset_pattern = "Sparkle-2.9.6.tar.xz", checksum = "sha256:52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192", bin_path = "bin", filter_bins = ["BinaryDelta", "generate_appcast", "generate_keys", "sign_update"] }
go = "1.26.4"
shellcheck = "0.11.0"
xcodegen = "2.46.0"

[tasks.generate]
description = "生成统一 Presentation Contract 与 Xcode 工程"
run = [
  "cd backend && go run ./cmd/contractgen -root ..",
  "xcodegen generate",
]

[tasks."contract:check"]
description = "确认 Swift、C# 与 XAML Presentation Contract 生成文件无漂移"
run = "cd backend && go run ./cmd/contractgen -root .. -check"

[tasks.build]
description = "构建 Codex Tweaks.app 并输出到 dist/"
depends = ["generate"]
run = [
  "xcodebuild -project CodexTweaks.xcodeproj -scheme CodexTweaks -configuration Release -destination \"platform=macOS,arch=$(uname -m)\" -derivedDataPath build/DerivedData -packageAuthorizationProvider netrc ARCHS=$(uname -m) build",
  "mkdir -p dist",
  "rm -rf 'dist/Codex Tweaks.app'",
  "ditto 'build/DerivedData/Build/Products/Release/Codex Tweaks.app' 'dist/Codex Tweaks.app'",
]

[tasks.test]
description = "运行 Go 后端和 Swift 前端单元测试"
depends = ["generate"]
run = [
  "cd backend && go vet ./...",
  "cd backend && go test -race ./...",
  "cd backend && GOOS=windows GOARCH=amd64 go build ./...",
  "cd backend && GOOS=windows GOARCH=arm64 go build ./...",
  "mise run contract:check",
  "xcodebuild -project CodexTweaks.xcodeproj -scheme CodexTweaks -configuration Debug -destination \"platform=macOS,arch=$(uname -m)\" -derivedDataPath build/DerivedData -packageAuthorizationProvider netrc test",
]

[tasks.verify]
description = "执行工作流检查、测试、Release 构建和差异检查"
run = [
  "mise run workflows:lint",
  "mise run test",
  "mise run build",
  "git diff --check",
  "git diff --exit-code -- CodexTweaks.xcodeproj contract/presentation-contract.json app/Sources/GeneratedPresentationContract.swift windows/CodexTweaks.Windows/Generated/PresentationContract.g.cs windows/CodexTweaks.Windows/Generated/PresentationResources.xaml",
]

[tasks."workflows:lint"]
description = "检查 GitHub Actions 工作流与 Release 脚本"
run = [
  "actionlint .github/workflows/*.yml",
  "shellcheck scripts/*.sh",
]

[tasks."release:package"]
description = "构建 universal、arm64、x86_64 三套 Release DMG"
depends = ["generate"]
run = "./scripts/package-release.sh"

[tasks."release:verify"]
description = "校验 Release App、DMG、架构、版本和最低系统版本"
run = "./scripts/verify-release.sh"

[tasks."release:sparkle"]
description = "创建并签名 Sparkle ZIP 与 appcast"
run = "./scripts/package-sparkle-update.sh"

[tasks.release]
description = "构建并校验完整 Release 产物"
run = [
  "mise run release:package",
  "mise run release:verify",
]

[tasks.launch]
description = "启动 dist/ 中的 Codex Tweaks.app"
depends = ["build"]
run = "open 'dist/Codex Tweaks.app'"

[tasks.kill]
description = "停止正在运行的 Codex Tweaks"
run = "pkill -x 'Codex Tweaks' 2>/dev/null || true"

[tasks.clean]
description = "清理构建产物"
run = "rm -rf build dist"
