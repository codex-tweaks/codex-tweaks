name: CodexTweaks
options:
  bundleIdPrefix: com.zgccrui
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODEX_TWEAKS_RELEASE_VERSION: "$(MARKETING_VERSION)"
    SPARKLE_PUBLIC_ED_KEY: "DwmQV4Y5oLUhQg3qPRw3RCd3cYTjYhAm31smb5mA0T4="

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  CodexTweaks:
    type: application
    platform: macOS
    productName: Codex Tweaks
    sources:
      - path: app/Sources
      - path: app/Resources/Assets.xcassets
      - path: app/Resources/Tweaks
        type: folder
      - path: Skills
        type: folder
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zgccrui.CodexTweaks
        PRODUCT_NAME: Codex Tweaks
        PRODUCT_MODULE_NAME: CodexTweaks
        INFOPLIST_FILE: app/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Go Backend
        script: |
          "$SRCROOT/scripts/build-go-backend.sh"
        basedOnDependencyAnalysis: false
  CodexTweaksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: app/Tests
    dependencies:
      - target: CodexTweaks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zgccrui.CodexTweaksTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  CodexTweaks:
    build:
      targets:
        CodexTweaks: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      environmentVariables:
        DYLD_FRAMEWORK_PATH: "$(BUILT_PRODUCTS_DIR)/Codex Tweaks.app/Contents/Frameworks"
      targets:
        - CodexTweaksTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
